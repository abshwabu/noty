[package]
name = "vault_core"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
hex = "0.4"
chacha20poly1305 = "0.10"
argon2 = "0.5"
reqwest = { version = "0.12", features = ["json", "blocking"] }

[dev-dependencies]
tempfile = "3"
